 <title>Honeywood footbridge, home-west-bridge</title>
 <desc>Unstretched Home timber. 28 boards and 11 posts per rail. Original board pitch 26.876956, post pitch 80.630869 world units. Dry landings 1137.84,3066.05 and 940,3780; unchanged 112-unit deck and 47.81310225627199-unit crown.</desc>
