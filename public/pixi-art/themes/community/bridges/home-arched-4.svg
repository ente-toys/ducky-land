<svg xmlns="http://www.w3.org/2000/svg" width="132.4" height="321" viewBox="53.8 13 132.4 321" data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ns.svg">
  <title>Honeywood footbridge, north-south</title>
  <desc>Hand-drawn 420 by 120 world-unit bridge, looking along the deck. Ground depth 0.62, 24-unit crown, mild twelve-unit width convergence. All cross-planks are straight and horizontal. Near bank is at the bottom.</desc>
  <g stroke="#39472d" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far and near bank sills. -->


    <!-- The arch is in the longitudinal profile, not a bent cross-section. -->
    <path fill="#6F78D8" d="M66 50 L60 322 L60 331 L66 59 Z M174 50 L180 322 L180 331 L174 59 Z" data-home-path="2"/>
    <path fill="#C9C3F2" d="M66 50 Q63 162 60 322 L180 322 Q177 162 174 50 Z" data-home-path="3"/>
    <!-- Fifteen broad boards follow the rise and fall of the crown. -->
    <path fill="none" stroke-width=".85" d="M65.6 62.2 L174.4 62.2 M65.2 75.2 L174.8 75.2 M64.8 89 L175.2 89 M64.4 103.7 L175.6 103.7 M64 119.4 L176 119.4 M63.6 135.8 L176.4 135.8 M63.2 153.1 L176.8 153.1 M62.8 171.3 L177.2 171.3 M62.4 190.2 L177.6 190.2 M62 210.1 L178 210.1 M61.6 230.8 L178.4 230.8 M61.2 252.4 L178.8 252.4 M60.8 274.7 L179.2 274.7 M60.4 297.9 L179.6 297.9" data-home-path="4"/>
