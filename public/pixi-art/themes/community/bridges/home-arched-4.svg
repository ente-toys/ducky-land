    <path fill="#C9C3F2" d="M59 318 L181 318 L181 323 L59 323 Z" data-home-path="7"/>
    <!-- Paired posts share exactly the same stations and heights. -->
    <g fill="#C9C3F2">
      <path d="M62.8 16 L69.2 16 L69.2 57 L62.8 57 Z M61.6 55 L68 55 L68 96 L61.6 96 Z M60.4 101.8 L66.8 101.8 L66.8 142.8 L60.4 142.8 Z M59.2 156.2 L65.6 156.2 L65.6 197.2 L59.2 197.2 Z M58 218.4 L64.4 218.4 L64.4 259.4 L58 259.4 Z M56.8 288 L63.2 288 L63.2 329 L56.8 329 Z" data-home-path="8"/>
