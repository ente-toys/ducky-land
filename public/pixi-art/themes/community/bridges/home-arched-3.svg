<svg xmlns="http://www.w3.org/2000/svg" width="132.4" height="323" viewBox="53.8 13 132.4 323" data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ns.svg">
  <title>Honeywood footbridge, north-south</title>
  <desc>Hand-drawn 420 by 120 world-unit bridge, looking along the deck. Ground depth 0.62, 24-unit crown, mild twelve-unit width convergence. All cross-planks are straight and horizontal. Near bank is at the bottom.</desc>
  <g stroke="#39472d" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far and near bank sills. -->


    <!-- The arch is in the longitudinal profile, not a bent cross-section. -->
    <path fill="#6F78D8" d="M66 50 L60 324 L60 333 L66 59 Z M174 50 L180 324 L180 333 L174 59 Z" data-home-path="2"/>
    <path fill="#C9C3F2" d="M66 50 Q63 163 60 324 L180 324 Q177 163 174 50 Z" data-home-path="3"/>
    <!-- Fifteen broad boards follow the rise and fall of the crown. -->
    <path fill="none" stroke-width=".85" d="M65.6 62.33333 L174.4 62.33333 M65.2 75.46667 L174.8 75.46667 M64.8 89.4 L175.2 89.4 M64.4 104.23333 L175.6 104.23333 M64 120.06667 L176 120.06667 M63.6 136.6 L176.4 136.6 M63.2 154.03333 L176.8 154.03333 M62.8 172.36667 L177.2 172.36667 M62.4 191.4 L177.6 191.4 M62 211.43333 L178 211.43333 M61.6 232.26667 L178.4 232.26667 M61.2 254 L178.8 254 M60.8 276.43333 L179.2 276.43333 M60.4 299.76667 L179.6 299.76667" data-home-path="4"/>
