    <path fill="#C9C3F2" d="M59 320 L181 320 L181 325 L59 325 Z" data-home-path="7"/>
    <!-- Paired posts share exactly the same stations and heights. -->
    <g fill="#C9C3F2">
      <path d="M62.8 16 L69.2 16 L69.2 57 L62.8 57 Z M61.6 55.4 L68 55.4 L68 96.4 L61.6 96.4 Z M60.4 102.6 L66.8 102.6 L66.8 143.6 L60.4 143.6 Z M59.2 157.4 L65.6 157.4 L65.6 198.4 L59.2 198.4 Z M58 220 L64.4 220 L64.4 261 L58 261 Z M56.8 290 L63.2 290 L63.2 331 L56.8 331 Z" data-home-path="8"/>
