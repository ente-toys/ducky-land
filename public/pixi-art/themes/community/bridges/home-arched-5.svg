<svg xmlns="http://www.w3.org/2000/svg" width="132.4" height="351" viewBox="53.8 13 132.4 351" data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ns.svg">
  <title>Honeywood footbridge, north-south</title>
  <desc>Hand-drawn 420 by 120 world-unit bridge, looking along the deck. Ground depth 0.62, 24-unit crown, mild twelve-unit width convergence. All cross-planks are straight and horizontal. Near bank is at the bottom.</desc>
  <g stroke="#39472d" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far and near bank sills. -->


    <!-- The arch is in the longitudinal profile, not a bent cross-section. -->
    <path fill="#6F78D8" d="M66 50 L60 352 L60 361 L66 59 Z M174 50 L180 352 L180 361 L174 59 Z" data-home-path="2"/>
    <path fill="#C9C3F2" d="M66 50 Q63 177 60 352 L180 352 Q177 177 174 50 Z" data-home-path="3"/>
    <!-- Fifteen broad boards follow the rise and fall of the crown. -->
    <path fill="none" stroke-width=".85" d="M65.6 64.2 L174.4 64.2 M65.2 79.2 L174.8 79.2 M64.8 95 L175.2 95 M64.4 111.7 L175.6 111.7 M64 129.4 L176 129.4 M63.6 147.8 L176.4 147.8 M63.2 167.1 L176.8 167.1 M62.8 187.3 L177.2 187.3 M62.4 208.2 L177.6 208.2 M62 230.1 L178 230.1 M61.6 252.8 L178.4 252.8 M61.2 276.4 L178.8 276.4 M60.8 300.7 L179.2 300.7 M60.4 325.9 L179.6 325.9" data-home-path="4"/>
