    <g fill="#C9C3F2">
      <path d="M62.8 16 L69.2 16 L69.2 57 L62.8 57 Z M61.6 61 L68 61 L68 102 L61.6 102 Z M60.4 113.8 L66.8 113.8 L66.8 154.8 L60.4 154.8 Z M59.2 174.2 L65.6 174.2 L65.6 215.2 L59.2 215.2 Z M58 242.4 L64.4 242.4 L64.4 283.4 L58 283.4 Z M56.8 318 L63.2 318 L63.2 359 L56.8 359 Z" data-home-path="8"/>
