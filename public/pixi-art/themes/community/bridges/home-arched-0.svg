      <path d="M62.8 16 L69.2 16 L69.2 57 L62.8 57 Z M61.6 63.8 L68 63.8 L68 104.8 L61.6 104.8 Z M60.4 119.4 L66.8 119.4 L66.8 160.4 L60.4 160.4 Z M59.2 182.6 L65.6 182.6 L65.6 223.6 L59.2 223.6 Z M58 253.6 L64.4 253.6 L64.4 294.6 L58 294.6 Z M56.8 332 L63.2 332 L63.2 373 L56.8 373 Z" data-home-path="8"/>
