    <path fill="#6F78D8" d="M30 206.4 Q188 158.4 346 206.4 L346 214.4 Q188 166.4 30 214.4 Z" data-home-path="9"/>
    <path fill="#C9C3F2" d="M30 202.4 Q188 154.4 346 202.4 L346 206.4 Q188 158.4 30 206.4 Z" data-home-path="10"/>
    <g fill="#C9C3F2">
      <path d="M27 172.4 L33 172.4 L33 214.4 L27 214.4 Z M90.2 157 L96.2 157 L96.2 199 L90.2 199 Z M153.4 149.4 L159.4 149.4 L159.4 191.4 L153.4 191.4 Z M216.6 149.4 L222.6 149.4 L222.6 191.4 L216.6 191.4 Z M279.8 157 L285.8 157 L285.8 199 L279.8 199 Z M343 172.4 L349 172.4 L349 214.4 L343 214.4 Z" data-home-path="11"/>
      <path d="M30 199.4 Q188 151.4 346 199.4 L346 203.4 Q188 155.4 30 203.4 Z" data-home-path="12"/>
