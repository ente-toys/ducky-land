<svg xmlns="http://www.w3.org/2000/svg" width="295" height="452" viewBox="43 -122 295 452" data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ne.svg">
  <title>Honeywood footbridge, northeast</title>
  <desc>Hand-drawn solid bridge, 420 by 120 world units. The path rises northeast from the near bank at lower left. A 45-degree ground rotation is projected with 0.62 depth, and a 24-unit vertical crown. Cross-planks remain straight; both rails share one arch.</desc>
