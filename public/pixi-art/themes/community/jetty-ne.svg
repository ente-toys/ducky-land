      <path d="M46 232 L52 232 L52 273 L46 273 Z M108.2 169.8 L114.2 169.8 L114.2 210.8 L108.2 210.8 Z M171.4 114.6 L177.4 114.6 L177.4 155.6 L171.4 155.6 Z M233.6 68.4 L239.6 68.4 L239.6 109.4 L233.6 109.4 Z M295.8 29.2 L301.8 29.2 L301.8 70.2 L295.8 70.2 Z M359 -3 L365 -3 L365 38 L359 38 Z" data-home-path="2"/>
