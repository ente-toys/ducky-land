    <path fill="#6F78D8" d="M49 266 Q206 100.5 362 31 L447 83 L447 92 Q290 161.5 134 327 L49 275 Z" data-home-path="5"/>
    <path fill="#C9C3F2" d="M49 266 Q206 100.5 362 31 L447 83 Q290 152.5 134 318 Z" data-home-path="6"/>
