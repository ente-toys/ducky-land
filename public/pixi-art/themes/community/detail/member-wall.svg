<svg xmlns="http://www.w3.org/2000/svg" width="750" height="565" viewBox="0 0 1500 1130">
  <title>Campfire Commons: member wall</title>
  <desc>Hand-drawn complete member wall, with both pillars and their rounded feet. Original canvas and bottom-centre anchor retained.</desc>
  <defs>
    <g id="member" stroke-linecap="round" stroke-linejoin="round">
      <circle r="111" fill="#f6eedb" stroke="#374055" stroke-width="10"/>
      <circle r="88" fill="#fad54b" stroke="#374055" stroke-width="9"/>
      <ellipse cx="-35" cy="-14" rx="9" ry="13" fill="#374055"/>
      <ellipse cx="40" cy="-14" rx="9" ry="13" fill="#374055"/>
