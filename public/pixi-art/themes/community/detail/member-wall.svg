    <path d="M719 299C633 268 597 213 619 142C646 61 730 18 822 19C957 16 1057 86 1066 169C1077 270 992 315 805 312Q765 347 723 356Q694 365 707 337Z" fill="#a89cf5"/>
    <path d="M631 177Q651 66 819 36Q861 31 890 39" fill="none" stroke="#f6eedb" stroke-width="20"/>
