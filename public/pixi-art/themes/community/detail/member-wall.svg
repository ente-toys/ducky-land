    <path d="M172 1017Q750 875 1328 1017" fill="none" stroke="#8f8c9d" stroke-width="15"/>
    <!-- Left and right columns have matching complete silhouettes. -->
    <rect x="35" y="955" width="160" height="152" rx="23" fill="#6d6b89"/>
    <path d="M47 979Q112 957 184 979V1000Q112 1015 47 999Z" fill="#8f8c9d" stroke="none"/>
    <rect x="71" y="438" width="82" height="543" rx="22" fill="#6d6b89"/>
    <path d="M80 475V945" fill="none" stroke="#8f8c9d" stroke-width="13"/>
    <path d="M49 979Q65 959 84 982" fill="none" stroke="#a89cf5" stroke-width="18"/>
    <rect x="1305" y="955" width="160" height="152" rx="23" fill="#6d6b89"/>
    <path d="M1317 979Q1382 957 1454 979V1000Q1382 1015 1317 999Z" fill="#8f8c9d" stroke="none"/>
    <rect x="1347" y="438" width="82" height="543" rx="22" fill="#6d6b89"/>
