<svg xmlns="http://www.w3.org/2000/svg" width="830" height="695" viewBox="0 0 830 695">
<title>Campfire Commons, gathering canopy in the Home camera</title>
<desc>Upright front, visible curved lilac roof top and returned sides, warm campfire mural, timber deck and three centred cream steps. One tight contact shadow. Ink #39472d, flat colours only.</desc>
