<svg xmlns="http://www.w3.org/2000/svg" width="739" height="618" viewBox="0 0 1478 1236">
  <title>Campfire Commons concert stage</title>
  <desc>Hand-drawn complete stage. Symmetric arched canopy, eight pendant lights, paired pillars and speakers, cloud screen, plank floor and three steps, with a wooden access rail on the left. Ground anchor: bottom centre.</desc>
