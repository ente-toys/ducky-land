<svg xmlns="http://www.w3.org/2000/svg" width="470" height="431" viewBox="0 0 300 275">
<title>Buttercream Rose Cottage</title>
<desc>Hand-drawn rose cottage. Ink matched at game scale to the original pink dollhouse. Front gable, deep pitched roof, right wall and raised stone plinth.</desc>
