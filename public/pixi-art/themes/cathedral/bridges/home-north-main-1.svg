  <title>Honeywood footbridge, northwest</title>
  <desc>Hand-drawn solid bridge, 420 by 120 world units. The path rises northwest from the near bank at lower right. A 45-degree ground rotation is projected with 0.62 depth, and a 24-unit vertical crown. Cross-planks remain straight; both rails share one arch.</desc>
