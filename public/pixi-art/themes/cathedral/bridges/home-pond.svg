<svg xmlns="http://www.w3.org/2000/svg" width="132.4" height="719" viewBox="53.8 13 132.4 719" data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ns.svg">
  <title>Honeywood footbridge, north-south</title>
  <desc>Hand-drawn 420 by 120 world-unit bridge, looking along the deck. Ground depth 0.62, 24-unit crown, mild twelve-unit width convergence. All cross-planks are straight and horizontal. Near bank is at the bottom.</desc>
  <g stroke="#39472d" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round">
    <!-- Far and near bank sills. -->


    <!-- The arch is in the longitudinal profile, not a bent cross-section. -->
    <path fill="#8F5033" d="M66 50 L60 720 L60 729 L66 59 Z M174 50 L180 720 L180 729 L174 59 Z" data-home-path="2"/>
    <path fill="#CB7139" d="M66 50 Q63 361 60 720 L180 720 Q177 361 174 50 Z" data-home-path="3"/>
    <!-- Fifteen broad boards follow the rise and fall of the crown. -->
    <path fill="none" stroke-width=".85" d="M65.6 88.73333 L174.4 88.73333 M65.2 128.26667 L174.8 128.26667 M64.8 168.6 L175.2 168.6 M64.4 209.83333 L175.6 209.83333 M64 252.06667 L176 252.06667 M63.6 295 L176.4 295 M63.2 338.83333 L176.8 338.83333 M62.8 383.56667 L177.2 383.56667 M62.4 429 L177.6 429 M62 475.43333 L178 475.43333 M61.6 522.66667 L178.4 522.66667 M61.2 570.8 L178.8 570.8 M60.8 619.63333 L179.2 619.63333 M60.4 669.36667 L179.6 669.36667" data-home-path="4"/>
    <path fill="none" stroke-width=".65" d="M84 145.23624 L104 145.23624 M136 228.44329 L158 228.44329 M78 316.51184 L95 316.51184 M126 404.18998 L147 404.18998 M88 501.59185 L113 501.59185 M146 594.24473 L166 594.24473 M77 691.87768 L99 691.87768" data-home-path="5"/>
    <!-- Square end beam, with a flat shaded face. -->
    <path fill="#8F5033" d="M60 720 L180 720 L180 729 L60 729 Z" data-home-path="6"/>
    <path fill="#CB7139" d="M59 716 L181 716 L181 721 L59 721 Z" data-home-path="7"/>
    <!-- Paired posts share exactly the same stations and heights. -->
    <g fill="#CB7139">
      <path d="M62.8 16 L69.2 16 L69.2 57 L62.8 57 Z M61.6 134.6 L68 134.6 L68 175.6 L61.6 175.6 Z M60.4 261 L66.8 261 L66.8 302 L60.4 302 Z M59.2 395 L65.6 395 L65.6 436 L59.2 436 Z M58 536.8 L64.4 536.8 L64.4 577.8 L58 577.8 Z M56.8 686 L63.2 686 L63.2 727 L56.8 727 Z" data-home-path="8"/>
