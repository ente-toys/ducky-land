    <path fill="none" stroke-width=".65" d="M84 79 L104 79 M136 107 L158 107 M78 139 L95 139 M126 173 L147 173 M88 213 L113 213 M146 253 L166 253 M77 297 L99 297"/>
    <!-- Square end beam, with a flat shaded face. -->
