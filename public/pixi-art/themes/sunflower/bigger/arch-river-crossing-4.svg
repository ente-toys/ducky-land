<svg data-home-source="/pixi-art/home-expansion-c/bridges/bridge-ns.svg" xmlns="http://www.w3.org/2000/svg" width="244" height="371.5675675675676" viewBox="6610 415.7027027027027 244 371.5675675675676"><g transform="matrix(1 0 0 1.0811 6612 417.7027)">
  <title>Honeywood footbridge, north-south</title>
  <desc>Hand-drawn 420 by 120 world-unit bridge, looking along the deck. Ground depth 0.62, 24-unit crown, mild twelve-unit width convergence. All cross-planks are straight and horizontal. Near bank is at the bottom.</desc>
  <g stroke="#39472d" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round"><!-- The arch is in the longitudinal profile, not a bent cross-section. -->
