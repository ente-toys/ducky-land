<!doctype html><html><meta charset="utf-8"><title>Walk overlay</title><style>body{margin:0;background:#222}svg{width:100vw;height:100vh;display:block;background:#80c5dc}</style><script type="module">
import walk from '../assets/world/walk-world.json';import world from '../assets/world/world.json';import {geometry} from '../assets/world/island-geometry.mjs';
import art from '../src/world/home/art-manifest.json';import{createPlacements,trimWorld}from '../src/world/home/placements.js';
const q=new URLSearchParams(location.search),box=(q.get('box')||'0,0,5800,4400').split(',').map(Number),step=+(q.get('step')||16);
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',box.join(' '));document.body.append(svg);
const add=(tag,attrs)=>{const el=document.createElementNS(svg.namespaceURI,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);svg.append(el);return el;};
add('image',{href:'/pixi-art/ground.svg',x:0,y:0,width:world.width,height:world.height});
for(const p of art.floating)add('image',{href:p.src,x:p.x-p.anchor.x*p.width,y:p.y-p.anchor.y*p.height,width:p.width,height:p.height});
const tw=trimWorld(world);
for(const p of createPlacements(tw,geometry({...tw,obstacles:[]}).walkable).sort((a,b)=>a.y-b.y))add('image',{href:p.src,x:p.x-p.anchor.x*p.width*p.scale,y:p.y-p.anchor.y*p.height*p.scale,width:p.width*p.scale,height:p.height*p.scale});
const {walkable}=geometry(walk);let d='';
for(let y=box[1];y<box[1]+box[3];y+=step)for(let x=box[0];x<box[0]+box[2];x+=step)if(!walkable(x+step/2,y+step/2))d+=`M${x} ${y}h${step}v${step}h${-step}z`;
add('path',{d,fill:'rgba(255,0,60,.33)'});
add('polygon',{points:walk.coast.map(p=>p.join(',')).join(' '),fill:'none',stroke:'cyan','stroke-width':6});
add('path',{d:'M5180.5,1642.85C5251.21,1839.5 5411.65,2032.7 5428.9,2232.8C5446.15,2432.9 5365.08,2677.85 5284,2843.45C5202.92,3009.05 5116.68,3145.33 4942.45,3226.4C4768.22,3307.47 4442.2,3281.6 4238.65,3329.9',fill:'none',stroke:'yellow','stroke-width':8});
window.__ready=true;
</script></html>
