<!doctype html><html lang="en"><meta charset="utf-8"><title>Ducky Land · Boat perspective fix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7df;color:#302c23;font:15px system-ui,sans-serif}header{padding:20px 28px;display:flex;align-items:center;gap:16px}h1{font-size:20px;margin:0 auto 0 0}button,select{font:inherit;color:inherit;background:#ffda69;border:1px solid #77633d;border-radius:10px;padding:9px 14px;cursor:pointer}.labels{display:grid;grid-template-columns:1fr 1fr;padding:10px 28px;background:#fff1c6;gap:28px}.labels strong{display:block;margin-bottom:3px}.labels span{font-size:13px;color:#655b46}canvas{display:block;width:100%;height:auto}footer{padding:14px 28px;font-size:13px}
</style>
<header><h1>Boat perspective</h1><select aria-label="Island approach"><option value="isle-251">Pagepond → Bog</option><option value="sunset">Rosybutton → Bog</option><option value="isle-176">Bellovo → Bog</option><option value="isle-170">Fair → Bog</option></select><button id="turn">Turn boat</button><button id="sail">Pause sailing</button></header>
<div class="labels"><div><strong>Before</strong><span>Boat and rider inherit the island’s rotation.</span></div><div><strong>Fixed locally</strong><span>Island keeps its angle. Boat and rider stay upright.</span></div></div>
<main id="view"></main><footer id="status">Loading the game’s boat, Ducky and Bog artwork…</footer>
<script type="module">
import {Application,Container,Sprite,Assets,RenderTexture} from 'pixi.js';
import {createDuck} from '/src/rendering/pixi/duck.js';
import {createSailingFX} from '/src/rendering/pixi/sailing-fx.js';
import {createLivePatches} from '/src/rendering/pixi/sphere-mesh.js';
import {withRigidVisitors} from '/src/rendering/shared/rigid-visitors.js';
import {unplaceRigid,placeRigid} from '/src/world/rigid.js';
import {mapOf} from '/src/world/island-maps.js';
import {harborOf} from '/src/gameplay/islands.js';
import {PALETTE} from '/src/rendering/shared/palette.js';
const W=680,H=580,to='isle-249',m=mapOf(to),app=new Application();
await app.init({width:W*2,height:H,resolution:Math.min(devicePixelRatio,2),background:PALETTE.water,antialias:true});
document.querySelector('#view').append(app.canvas);app.stop();
const texture=await Assets.load('/pixi-art/globe/bog.svg'),panels=[],empty=new Container();
for(let side=0;side<2;side++){
 const scene=new Container(),water=new Container(),objects=new Container({sortableChildren:true});scene.addChild(water,objects);
 const island=new Sprite(texture);island.position.set(m.origin.x,m.origin.y);island.width=m.width;island.height=m.height;water.addChild(island);
 const duck=await createDuck({outfit:{},seed:0}),root=new Container(),sprite=new Sprite();root.addChild(sprite);objects.addChild(root,duck.root);
 const fx=await createSailingFX({water,objects}),entry={root,sprite};
 const target=RenderTexture.create({width:W,height:H}),screen=new Sprite(target);screen.x=side*W;app.stage.addChild(screen);
 panels.push({scene,duck,fx,entry,target,patch:createLivePatches(app.renderer)});
}
let heading=-Math.PI/2,running=true,start=performance.now(),from='isle-251',phase=0,last=performance.now();
document.querySelector('select').onchange=e=>{from=e.target.value;};
document.querySelector('#turn').onclick=()=>{heading+=Math.PI/4;};
document.querySelector('#sail').onclick=e=>{running=!running;e.target.textContent=running?'Pause sailing':'Resume sailing';};
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;if(running)phase+=dt;
 const h=harborOf(to).water,local={x:h.x+Math.sin(phase*.55)*260,y:h.y+180+Math.cos(phase*.55)*100};
 const p=placeRigid(from,to,local),camera={x:p.x,y:p.y-40,zoom:.95};
 for(let side=0;side<2;side++){
  const {scene,duck,fx,entry,target,patch}=panels[side],boat={id:'review',...p,turn:heading,occupant:'rider',travel:running?100:0};
  entry.root.zIndex=p.y+2;fx.boat(entry,boat,false);
  const look=fx.duck({id:'rider',...p,mode:'sailing',boatId:'review',turn:heading,travel:boat.travel},false);
  duck.root.position.set(look.x,look.y);duck.root.scale.set(look.scale);duck.root.rotation=look.rotation;duck.root.zIndex=look.z;
  duck.update(dt,{turn:look.turn,time:(now-start)/1000,reducedMotion:false,action:0,speed:0,sailing:true});fx.front(entry);
  const actors=[entry.root,duck.root,entry.front];
  app.renderer.render({container:empty,target,clear:true,clearColor:PALETTE.water});
  const draw=()=>patch.draw(from,to,scene,camera,W,H,1,target);
  if(side)withRigidVisitors(from,to,actors,draw);
  else {
   const saved=actors.map(o=>({o,x:o.x,y:o.y,z:o.zIndex}));
   for(const {o,y,z}of saved){const p=unplaceRigid(from,to,o);o.position.set(p.x,p.y);o.zIndex=z+p.y-y;}
   draw();for(const {o,x,y,z}of saved){o.position.set(x,y);o.zIndex=z;}
  }
 }
 app.render();app.canvas.dataset.state='ready';app.canvas.dataset.approach=from;
 document.querySelector('#status').textContent='Local rendering check · real boat and Ducky artwork · original island shapes · nothing pushed';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></html>
