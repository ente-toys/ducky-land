<!-- The old bathing beach is a meadow. The new beach opens onto the southeast sea. -->
<g clip-path="url(#beach-land)"><path d="M5390 5710 C5530 5420 5680 5250 5980 5280 C6240 5300 6440 5420 6700 5380 C6950 5340 7060 5290 7250 5320 C7400 5330 7460 5190 7600 4980" fill="none" stroke="#FCEBD6" stroke-width="200" stroke-linecap="round"/></g>
