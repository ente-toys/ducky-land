<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Home C, local review</title><style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#6ec9de}aside{position:fixed;z-index:2;left:12px;top:12px;background:#fff0c7e8;padding:12px;border:1px solid #b1934b;border-radius:8px;font:13px system-ui;color:#39472d;max-width:300px}select,button{font:inherit;margin:4px 0}pre{white-space:pre-wrap;margin:4px 0}</style></head><body><div id="game"></div><aside><strong>Home C, local review</strong><br><select id="view"><option value="overview">Whole island</option><option value="plaza">Original plaza</option><option value="globe">Globe</option></select><a href="?view=overview">Overview</a> <a href="?view=windmill-gardens">Garden</a> <a href="?view=globe">Globe</a><br><button id="walk">Walk to selected place</button><pre id="status">Loading production artwork...</pre></aside><script type="module">
import {PixiIsland} from '/src/pixi/engine.js';import E from '/src/pixi/home-expansion.json';import {HOME_MAP} from '/src/pixi/island-maps.js';
window.game=new PixiIsland({onError:e=>{window.reviewError=String(e);}});await game.mount(document.getElementById('game'));
const view=document.getElementById('view');for(const p of [...E.places.slice(6),...E.openSpaces])view.add(new Option(p.id,p.id));
window.reviewCamera=(x,y,zoom)=>{game.follow=false;game.fitMode=false;game.fly=null;Object.assign(game.camera,{x,y,zoom});Object.assign(game.target,game.camera);};
function show(){const p=[...E.places,...E.openSpaces].find(p=>p.id===view.value);window.reviewCamera(...(p?[...p.point,.8]:view.value==='plaza'?[2817,2370,.8]:view.value==='globe'?[HOME_MAP.cx,HOME_MAP.cy,.006]:[HOME_MAP.cx,HOME_MAP.cy,.115]));}
view.value=new URLSearchParams(location.search).get('view')??'overview';view.onchange=show;document.getElementById('walk').onclick=()=>{const p=E.places.find(p=>p.id===view.value);if(p){const d=game.sim.ducks[0];d.path=HOME_MAP.nav().route(d.x,d.y,...p.point);}};show();window.reviewReady=true;
let frames=0,start=performance.now();setInterval(()=>{const unique=new Set(),sources=[];function visit(c){if(c.texture?.source&&!unique.has(c.texture.source)){unique.add(c.texture.source);sources.push(c.texture.source);}for(const a of c.children??[])visit(a);}visit(game.app.stage);const ground=new Set(game.homeGround.children.filter(c=>c.texture).map(c=>c.texture.source));const mb=s=>s.reduce((n,t)=>n+(t.pixelWidth??t.width)*(t.pixelHeight??t.height)*4,0)/1048576;document.getElementById('status').textContent=JSON.stringify({ready:!game.sceneryPending,props:globalThis.__duckyProps.length,sleepers:globalThis.__duckySleepers.length,groundMiB:+mb([...ground]).toFixed(1),sceneTextureMiB:+mb(sources).toFixed(1),jsHeapMiB:performance.memory?+(performance.memory.usedJSHeapSize/1048576).toFixed(1):null,homeSnapshot:game.archipelago?.has('home'),error:window.reviewError??null},null,2);},1800);
</script></body></html>
