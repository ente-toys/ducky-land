<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ed66b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ducky Land</title>
<style>
  :root { color-scheme: light; --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #8ed66b; touch-action: none; }
  body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font: 14px sans-serif; }
  #play { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #actions { position: absolute; right: calc(14px + var(--safe-right)); bottom: calc(14px + var(--safe-bottom)); display: flex; gap: 8px; }
  .action { width: 58px; height: 44px; padding: 0; border: 0; border-radius: 18px; background: transparent; color: transparent; touch-action: none; cursor: pointer; }
  .action:focus-visible { outline: 3px solid #232323; outline-offset: 3px; }
  #safe { position: absolute; visibility: hidden; padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); pointer-events: none; }
  #status { position: absolute; left: max(20px, var(--safe-left)); right: max(20px, var(--safe-right)); top: 45%; text-align: center; color: #232323; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main id="play" aria-label="Ducky Land plaza">
  <canvas id="c" tabindex="0" aria-label="Ducky Land. Drag anywhere to waddle. Tap a path to walk there. Q to quack. E to dance." aria-describedby="instructions"></canvas>
  <p id="instructions" class="sr">Drag anywhere to move with a floating joystick. Lift to stop. Tap the plaza to walk there. Use the Quack and Dance buttons, including while moving. Keyboard: WASD or arrows, Q to quack, E to dance. Escape stops movement.</p>
  <div id="actions" aria-label="Ducky actions">
    <button class="action" id="quack" aria-label="Quack">Quack</button>
    <button class="action" id="dance" aria-label="Dance" aria-pressed="false">Dance</button>
  </div>
  <div id="safe"></div>
  <div id="status" role="status">Waking the Duckies…</div>
</main>
<script src="rive.js"></script>
<script src="mobile.js"></script>
</body>
</html>
