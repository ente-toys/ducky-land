<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ducky Land</title>
<style>
  html, body { margin: 0; height: 100%; background: #8ed66b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Ducky Land plaza. Move with WASD or arrow keys, or tap. Number keys: 1 quack, 2 heart, 3 laugh, 4 wave, 5 sleep, 6 angry, 7 party. M toggles sound."></canvas>
<script src="rive.js"></script><script>rive.RuntimeLoader.setWasmUrl("rive.wasm");rive.RuntimeLoader.setWasmFallbackUrl("rive_fallback.wasm");</script>
<script src="sounds.js"></script>
<script>
// Ducky Land living plaza: the .riv draws everything; this page only moves the ducks.
// Every frame the ducks are sorted by y and written into the plaza's 16 slots (slot 0 = furthest back).
const audio = new LocalSounds();
const EMOTES = [null, {name:'Quack',action:2,duration:1.34}, {name:'Heart',action:4,duration:1.52}, {name:'Laugh',action:5,duration:1.59}, {name:'Wave',action:6,duration:1.59}, {name:'Sleep',action:7,duration:2.29}, {name:'Angry',action:8,duration:1.55}, {name:'Party',action:9,duration:1.79}];
const W = 1600, H = 1000, SLOTS = 16;
const CITIES = ['Kochi', 'Chennai', 'Bengaluru', 'London'];
const NAMES = ['quackers', 'mo', 'aya_22', 'bread_boy', 'pip', 'lulu', 'nori', 'miso', 'toto', 'sunny', 'peep', 'boba', 'kai', 'bea', 'waddles'];
const ACC = [0, 1, 2, 3, 4, 5, 6, 7];  // Acc 6 (the bong) is not in the file at all
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// walkable: inside the plaza ellipse, outside the fountain
function walkable(x, y) {
  const p = ((x - 800) / 560) ** 2 + ((y - 640) / 290) ** 2;
  const f = ((x - 800) / 250) ** 2 + ((y - 575) / 120) ** 2;
  return p <= 1 && f >= 1;
}
function randomSpot() {
  for (;;) { const x = rnd(240, 1360), y = rnd(350, 930); if (walkable(x, y)) return [x, y]; }
}

function makeDuck(i, player) {
  let [x, y] = player ? [800, 820] : randomSpot();
  if (!player) {
    for (let attempt=0;attempt<160;attempt++) {
      if (ducks.every(d=>Math.hypot(d.x-x,d.y-y)>132)) break;
      [x,y]=randomSpot();
    }
  }
  return {
    x, y, tx: x, ty: y, player, action: 0, facing: 1, until: 0, wait: rnd(0, 2),
    name: player ? 'you' : NAMES[i % NAMES.length], city: player ? 1 : Math.floor(Math.random() * 4),
    cap: player ? 8 : (Math.random() < 0.85 ? 1 + Math.floor(Math.random() * 13) : 0),
    shades: player ? 0 : Math.random() < 0.35 ? 1 + Math.floor(Math.random() * 3) : 0,
    acc: player ? 0 : Math.random() < 0.45 ? pick(ACC.slice(1)) : 0,
    shoes: player ? 2 : Math.random() < 0.7 ? 1 + Math.floor(Math.random() * 10) : 0,
  };
}
const ducks = [makeDuck(0, true)];
for (let i = 0; i < 12; i++) ducks.push(makeDuck(i, false));
const player = ducks[0];
const quacks = [0, 0, 0, 0];

const keys = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  void audio.unlock();
  if (!e.repeat && /^[1-7]$/.test(k)) { emote(Number(k)); e.preventDefault(); }
  if (!e.repeat && k === 'q') emote(1);
  if (!e.repeat && k === 'm') audio.muted = !audio.muted;
  if (!e.repeat && k === 'e') { player.action = player.action === 3 ? 0 : 3; player.until = player.action === 3 ? now + 6 : 0; }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); player.tapping = false; });
let emoteOrder = null;
function emote(number) {
  const spec = EMOTES[number]; if (!spec || !vmi) return;
  player.tapping = false; player.tx = player.x; player.ty = player.y;
  // Brief neutral state allows the same number to restart its native one-shot timeline.
  player.action = 0; player.pendingEmote = spec; player.startEmoteAt = now + .05;
  emoteOrder = [...ducks].sort((a,b) => a.y-b.y);
  if (number === 1 || number === 3) void audio.play('quack', .22);
  else void audio.play('pop', .19);
  if (number === 1) quacks[player.city]++;
}

let now = 0;
function quack(d) {
  d.action = 2; d.until = now + 1.25; quacks[d.city]++;
}

const canvas = document.getElementById('c');
function toArtboard(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const s = Math.min(r.width / W, r.height / H);
  return [(cx - r.left - (r.width - W * s) / 2) / s, (cy - r.top - (r.height - H * s) / 2) / s];
}
canvas.addEventListener('pointerdown', e => {
  void audio.unlock(); canvas.focus({preventScroll:true});
  const [x, y] = toArtboard(e.clientX, e.clientY);
  if (walkable(x, y) && !player.emoting && !player.pendingEmote) { player.tx = x; player.ty = y; player.tapping = true; if (player.action === 3) player.action = 0; }
});

function step(d, dt) {
  const speed = 150;
  if (d.player) {
    if (d.pendingEmote && now >= d.startEmoteAt) {
      d.action = d.pendingEmote.action; d.until = now + d.pendingEmote.duration;
      d.pendingEmote = null; d.emoting = true;
    }
    if (d.emoting || d.pendingEmote) {
      if (now < d.until || d.pendingEmote) return;
      d.emoting = false; d.action = 0; emoteOrder = null;
    }
    let vx = 0, vy = 0;
    if (keys.has('a') || keys.has('arrowleft')) vx -= 1;
    if (keys.has('d') || keys.has('arrowright')) vx += 1;
    if (keys.has('w') || keys.has('arrowup')) vy -= 1;
    if (keys.has('s') || keys.has('arrowdown')) vy += 1;
    if (vx || vy) { d.tapping = false; d.tx = d.x; d.ty = d.y; }
    if (!vx && !vy && d.tapping) { const dx = d.tx - d.x, dy = d.ty - d.y, l = Math.hypot(dx, dy); if (l > 4) { vx = dx / l; vy = dy / l; } else d.tapping = false; }
    const l = Math.hypot(vx, vy);
    if (l) {
      const nx = d.x + vx / l * speed * dt, ny = d.y + vy / l * speed * dt;
      if (walkable(nx, ny)) { d.x = nx; d.y = ny; } else if (walkable(nx, d.y)) d.x = nx; else if (walkable(d.x, ny)) d.y = ny;
      if (vx) d.facing = vx < 0 ? -1 : 1;
      if (d.action !== 2) d.action = 1;
      if (now > (d.nextStep || 0)) { void audio.play('step', .075); d.nextStep = now + .33; }
    } else if (d.action === 1) d.action = 0;
    if (d.action === 2 && now > d.until) d.action = 0;
    if (d.action === 3 && now > d.until) d.action = 0;
    return;
  }
  // crowd
  if ((d.action === 2 || d.action === 3) && now < d.until) return;
  if (d.action === 2 || d.action === 3) d.action = 0;
  const dx = d.tx - d.x, dy = d.ty - d.y, l = Math.hypot(dx, dy);
  if (l > 4) {
    const nx = d.x + dx / l * speed * 0.75 * dt, ny = d.y + dy / l * speed * 0.75 * dt;
    if (Math.hypot(nx-player.x,ny-player.y)<(player.emoting?165:110)) { d.tx=d.x;d.ty=d.y;d.action=0;d.wait=.4;return; }
    if (walkable(nx, ny)) { d.x = nx; d.y = ny; d.action = 1; if (Math.abs(dx) > 2) d.facing = dx < 0 ? -1 : 1; }
    else { d.tx = d.x; d.ty = d.y; }
    return;
  }
  d.action = 0;
  d.wait -= dt;
  if (d.wait > 0) { if (Math.random() < dt * 0.15) quack(d); return; }
  const r = Math.random();
  if (r < 0.15) { d.action = 3; d.until = now + rnd(2.5, 5); }
  else if (r < 0.3) quack(d);
  else [d.tx, d.ty] = randomSpot();
  d.wait = rnd(0.8, 3.5);
}

let vmi, slots = [], cache = [];
function write(i, key, val, kind) {
  const c = cache[i];
  if (c[key] === val) return;
  c[key] = val;
  const p = kind === 's' ? slots[i].string(key) : slots[i].number(key);
  if (p) p.value = val;
}
function sync() {
  const order = emoteOrder || [...ducks].sort((a, b) => a.y - b.y);
  for (let i = 0; i < SLOTS; i++) {
    const d = order[i];
    if (!d) { write(i, 'x', -2000); continue; }
    write(i, 'x', Math.round(d.x)); write(i, 'y', Math.round(d.y));
    write(i, 'action', d.action); write(i, 'facing', d.facing);
    write(i, 'cap', d.cap); write(i, 'shades', d.shades); write(i, 'acc', d.acc); write(i, 'shoes', d.shoes);
    write(i, 'city', d.city); write(i, 'isPlayer', d.player ? 1 : 0);
    write(i, 'name', ' ' + d.name + ' ', 's');
  }
  const rows = [0, 1, 2, 3].sort((a, b) => quacks[b] - quacks[a]);
  rows.forEach((c, r) => {
    const n = vmi.number('r' + r + 'city'); if (n && n.value !== c) n.value = c;
    const s = vmi.string('r' + r + 'name'); if (s && s.value !== CITIES[c]) s.value = CITIES[c];
    const q = vmi.string('r' + r + 'count'); if (q && q.value !== String(quacks[c])) q.value = String(quacks[c]);
  });
}

let last = 0, nextSplash = 0;
function loop(t) {
  if (window.qaManual) return;
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t; now = t / 1000;
  for (const d of ducks) step(d, dt);
  sync();
  if (now > nextSplash && Math.hypot(player.x-800, player.y-560) < 380) { void audio.play('splash', .085); nextSplash = now + 3; }
  requestAnimationFrame(loop);
}

const r = new rive.Rive({
  src: 'ducky-land.riv?v=living-1', canvas, autoplay: true, autoBind: true, artboard: 'Plaza', stateMachines: 'Plaza',
  layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
  onLoad() {
    r.resizeDrawingSurfaceToCanvas(Math.min(devicePixelRatio || 1, 2));
    vmi = r.viewModelInstance;
    for (let i = 0; i < SLOTS; i++) { slots.push(vmi.viewModel('slot' + i)); cache.push({}); }
    vmi.string('flock').value = ' Your flock: Chennai ';
    vmi.string('online').value = ' ' + ducks.length + ' ducks in the plaza ';
    window.game = { r, vmi, ducks, player, slots, emote, audio, EMOTES, keys,
      advance(dt) { now += dt; for (const d of ducks) step(d,dt); sync(); r.advanceAndReportChanges(dt); },
      draw() { r.renderer.clear();r.renderer.save();r.alignRenderer();r.artboard.draw(r.renderer);r.renderer.restore();r.renderer.flush();r.runtime.resolveAnimationFrame(); }
    };
    canvas.focus({preventScroll:true});
    requestAnimationFrame(loop);
  },
});
addEventListener('resize', () => r.resizeDrawingSurfaceToCanvas(Math.min(devicePixelRatio || 1, 2)));
</script>
<script src="qa-capture.js"></script>
</body>
</html>
