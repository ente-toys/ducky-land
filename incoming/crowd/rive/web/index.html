<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducky Land</title>
<style>
html,body{margin:0;height:100%;background:#a9da84;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Ducky Land plaza. WASD or arrows to move, tap to walk, Q to quack, E to start a dance party."></canvas>
<script src="rive.js"></script>
<script type="module">
import {CrowdBrain} from './brain.mjs';
const layout=await fetch('plaza-layout.json').then(r=>r.json());
const brain=new CrowdBrain(layout,Number(new URLSearchParams(location.search).get('seed'))||2808);
const canvas=document.getElementById('c'),W=1600,H=1000,SLOTS=32;
let slots=[],cache=[],last=0,ready=false;
// Everything visible, including the greeting and sleep marks, is inside the .riv.
function write(i,key,val,kind){
  if(cache[i][key]===val)return;
  cache[i][key]=val;
  const p=kind==='s'?slots[i].string(key):slots[i].number(key);
  if(p)p.value=val;
}
function sync(){
  const order=brain.renderSlots();
  for(let i=0;i<SLOTS;i++){
    const d=order[i];
    if(!d){write(i,'x',-2000);write(i,'y',-2000);continue;}
    write(i,'x',Math.round(d.x*10)/10);write(i,'y',Math.round(d.y*10)/10);
    for(const k of ['action','facing','cap','shades','acc','shoes','city'])write(i,k,d[k]);
    write(i,'isPlayer',d.player?1:0);write(i,'name',' '+d.name+' ','s');
  }
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!document.hidden)brain.update(dt);
  sync();requestAnimationFrame(loop);
}
function toWorld(cx,cy){const b=canvas.getBoundingClientRect(),s=Math.min(b.width/W,b.height/H);return [(cx-b.left-(b.width-W*s)/2)/s,(cy-b.top-(b.height-H*s)/2)/s];}
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});const [x,y]=toWorld(e.clientX,e.clientY);brain.tap(x,y);});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();brain.keys.add(k);
  if(!e.repeat&&ready){if(k==='q')brain.quack();if(k==='e'){if(brain.party?.leader===0)brain.endParty();else brain.startParty();}}
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>brain.keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>brain.keys.clear());
// A local WASM URL keeps the local prototype self-contained.
rive.RuntimeLoader.setWasmUrl('rive.wasm');
const r=new rive.Rive({
  src:'ducky-land.riv?v=crowd-brain-9',canvas,autoplay:true,autoBind:true,artboard:'Plaza',stateMachines:'Plaza',
  layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),
  onLoad(){
    r.resizeDrawingSurfaceToCanvas(Math.min(devicePixelRatio||1,2));
    const vmi=r.viewModelInstance;
    for(let i=0;i<SLOTS;i++){slots.push(vmi.viewModel('slot'+i));cache.push({});}
    ready=true;window.game={r,vmi,slots,brain,ducks:brain.ducks,player:brain.player,snapshot:()=>brain.snapshot()};
    sync();requestAnimationFrame(loop);
  },
  onLoadError(e){console.error('Plaza failed to load',e);}
});
addEventListener('resize',()=>r.resizeDrawingSurfaceToCanvas(Math.min(devicePixelRatio||1,2)));
</script>
</body>
</html>
