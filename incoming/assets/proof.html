<!doctype html><html lang="en"><meta charset="utf-8"><title>Ducky Land / native Rive import proof</title>
<style>html,body{margin:0;background:#fff4c5}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c" width="2600" height="1240"></canvas><script src="rive/web/rive.js"></script>
<script>
rive.RuntimeLoader.setWasmUrl('rive/web/rive.wasm');
window.proofErrors=[];
const r=new rive.Rive({src:'pipeline-five/build/ducky-five-imports.riv?v=1',canvas:document.getElementById('c'),artboard:'Five Imports',autoplay:true,layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),onLoad(){r.resizeDrawingSurfaceToCanvas();window.riveProofReady=true},onLoadError(e){window.proofErrors.push(String(e))}});
window.addEventListener('resize',()=>r.resizeDrawingSurfaceToCanvas());
window.riveProof=r;
</script></html>
